<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Anti-caching headers for fresh deployment -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Unregister Service Workers & Clear CacheStorage -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <title>Set Architect | Harmonic DJ Set Builder</title>
    <meta name="description" content="Professional Harmonic DJ Set Builder, Stem Mashup Blender, and Dual Deck Practice Console for Desktop and Mobile DJs." />
    <meta name="theme-color" content="#0d0e12" />
    
    <!-- iOS / iPadOS Web App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SetArchitect" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Web Application Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body class="bg-[#0d0e12] text-slate-100 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
